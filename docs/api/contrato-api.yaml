openapi: 3.0.3
info:
  title: Helpdesk Corporativo API
  description: Contrato técnico das rotas reais expostas pelo backend Express.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Ambiente local

tags:
  - name: Health
  - name: Auth
  - name: Usuarios
  - name: Empresas
  - name: Agentes
  - name: Chamados
  - name: Chat
  - name: Notificacoes
  - name: Admin

paths:
  /teste:
    get:
      summary: Verificar se a API esta online
      tags: [Health]
      responses:
        "200":
          description: Rota de teste funcionando

  /auth/login:
    post:
      summary: Autenticar usuário
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /usuarios:
    post:
      summary: Criar usuário
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsuarioRequest"
      responses:
        "201":
          description: Usuário criado sem o campo senha
    get:
      summary: Listar usuários
      tags: [Usuarios]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuários

  /usuarios/{id}:
    get:
      summary: Obter usuário por ID
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Usuário encontrado
    put:
      summary: Atualizar usuário
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsuarioRequest"
      responses:
        "200":
          description: Usuário atualizado
    delete:
      summary: Deletar usuário
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Usuário deletado

  /empresas:
    get:
      summary: Listar empresas
      tags: [Empresas]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de empresas
    post:
      summary: Criar empresa
      tags: [Empresas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmpresaRequest"
      responses:
        "201":
          description: Empresa criada

  /empresas/{id}:
    get:
      summary: Obter empresa por ID
      tags: [Empresas]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Empresa encontrada
    put:
      summary: Atualizar empresa
      tags: [Empresas]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmpresaRequest"
      responses:
        "200":
          description: Empresa atualizada
    delete:
      summary: Deletar empresa
      tags: [Empresas]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Empresa deletada

  /agentes:
    get:
      summary: Listar agentes com dados do usuário e empresa
      tags: [Agentes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de agentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agente"
    post:
      summary: Criar vínculo de agente para um usuário
      tags: [Agentes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgenteRequest"
      responses:
        "201":
          description: Agente criado

  /agentes/{id}:
    get:
      summary: Obter agente por ID
      tags: [Agentes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Agente encontrado
    put:
      summary: Atualizar agente
      tags: [Agentes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgenteRequest"
      responses:
        "200":
          description: Agente atualizado
    delete:
      summary: Deletar agente
      tags: [Agentes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Agente deletado

  /agentes/{id}/disponibilidade:
    patch:
      summary: Atualizar disponibilidade do agente
      tags: [Agentes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disponivel]
              properties:
                disponivel:
                  type: boolean
      responses:
        "200":
          description: Disponibilidade atualizada

  /chamados:
    get:
      summary: Listar chamados
      description: Clientes recebem apenas os próprios chamados; agentes e admins recebem todos.
      tags: [Chamados]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de chamados
    post:
      summary: Abrir chamado
      tags: [Chamados]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChamadoRequest"
      responses:
        "201":
          description: Chamado criado

  /chamados/{id}:
    get:
      summary: Obter chamado por ID
      tags: [Chamados]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Chamado encontrado
    put:
      summary: Atualizar chamado
      tags: [Chamados]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Chamado atualizado
    delete:
      summary: Deletar chamado
      tags: [Chamados]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Chamado deletado

  /chamados/{id}/status:
    patch:
      summary: Alterar status do chamado
      tags: [Chamados]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/StatusChamado"
      responses:
        "200":
          description: Status atualizado

  /chamados/{id}/mensagens:
    get:
      summary: Listar mensagens do chamado
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Histórico de mensagens
    post:
      summary: Enviar mensagem no chamado
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMensagemRequest"
      responses:
        "201":
          description: Mensagem enviada

  /mensagens/{id}:
    delete:
      summary: Deletar mensagem
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Mensagem deletada

  /chamados/{id}/atribuir:
    patch:
      summary: Atribuir chamado a um agente
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idAgente:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Chamado atribuído

  /chamados/{id}/avaliar:
    patch:
      summary: Avaliar atendimento do chamado
      tags: [Chamados]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avaliacao]
              properties:
                avaliacao:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Avaliação registrada

  /upload:
    post:
      summary: Enviar anexo
      tags: [Chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        "200":
          description: URL e metadados do arquivo

  /notificacoes:
    get:
      summary: Listar notificações do usuário logado
      tags: [Notificacoes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de notificações
    post:
      summary: Criar notificação
      tags: [Notificacoes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificacaoRequest"
      responses:
        "201":
          description: Notificação criada

  /notificacoes/{id}:
    get:
      summary: Obter notificação por ID
      tags: [Notificacoes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notificação encontrada
    delete:
      summary: Deletar notificação
      tags: [Notificacoes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notificação deletada

  /notificacoes/{id}/lida:
    patch:
      summary: Marcar notificação como lida
      tags: [Notificacoes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notificação marcada como lida

  /categorias:
    get:
      summary: Listar categorias
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de categorias
    post:
      summary: Criar categoria
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoriaRequest"
      responses:
        "201":
          description: Categoria criada

  /categorias/{id}:
    delete:
      summary: Deletar categoria
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Categoria deletada

  /macros:
    get:
      summary: Listar macros
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de macros
    post:
      summary: Criar macro
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMacroRequest"
      responses:
        "201":
          description: Macro criada

  /macros/{id}:
    delete:
      summary: Deletar macro
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Macro deletada

  /logs:
    get:
      summary: Listar logs de auditoria
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logs de auditoria

  /analytics:
    get:
      summary: Obter indicadores do dashboard admin
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Métricas de chamados, CSAT e SLA

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer

  schemas:
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: usuario@empresa.com.br
        senha:
          type: string
          example: senha123

    LoginResponse:
      type: object
      properties:
        mensagem:
          type: string
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"

    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
        nome:
          type: string
        email:
          type: string
        nivelAcesso:
          type: string
          enum: [cliente, agente, admin]

    CreateUsuarioRequest:
      type: object
      required: [nome, email, senha, nivelAcesso]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
        nivelAcesso:
          type: string
          enum: [cliente, agente, admin]

    UpdateUsuarioRequest:
      type: object
      required: [nome, email, nivelAcesso]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        nivelAcesso:
          type: string
          enum: [cliente, agente, admin]

    CreateEmpresaRequest:
      type: object
      required: [nome, cnpj, email]
      properties:
        nome:
          type: string
        cnpj:
          type: string
        email:
          type: string
          format: email

    Agente:
      type: object
      properties:
        idAgente:
          type: integer
        idUsuario:
          type: integer
        idEmpresa:
          type: integer
        nome:
          type: string
        email:
          type: string
        nivelAcesso:
          type: string
          enum: [agente, admin, cliente]
        cargo:
          type: string
        disponivel:
          type: boolean
        empresaNome:
          type: string

    CreateAgenteRequest:
      type: object
      required: [idUsuario, idEmpresa, cargo]
      properties:
        idUsuario:
          type: integer
        idEmpresa:
          type: integer
        cargo:
          type: string
        disponivel:
          type: boolean
          default: true

    StatusChamado:
      type: string
      enum: [aberto, em_atendimento, aguardando_cliente, concluido, cancelado]

    PrioridadeChamado:
      type: string
      enum: [baixa, media, alta]

    CreateChamadoRequest:
      type: object
      required: [idCliente, titulo, descricao]
      properties:
        idCliente:
          type: integer
        idAgente:
          type: integer
          nullable: true
        idEmpresa:
          type: integer
          nullable: true
        titulo:
          type: string
        descricao:
          type: string
        categoria:
          type: string
          nullable: true
        prioridade:
          $ref: "#/components/schemas/PrioridadeChamado"
        anexo:
          type: string
          nullable: true
        mimeTypeAnexo:
          type: string
          nullable: true

    CreateMensagemRequest:
      type: object
      required: [idRemetente, mensagem]
      properties:
        idRemetente:
          type: integer
        mensagem:
          type: string
        anexo:
          type: string
          nullable: true
        mimeTypeAnexo:
          type: string
          nullable: true

    TipoNotificacao:
      type: string
      enum: [novo_chamado, nova_mensagem, status_alterado, chamado_concluido, chamado_cancelado]

    CreateNotificacaoRequest:
      type: object
      required: [idUsuario, tipo]
      properties:
        idUsuario:
          type: integer
        idChamado:
          type: integer
          nullable: true
        tipo:
          $ref: "#/components/schemas/TipoNotificacao"

    CreateCategoriaRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string

    CreateMacroRequest:
      type: object
      required: [titulo, texto]
      properties:
        titulo:
          type: string
        texto:
          type: string
